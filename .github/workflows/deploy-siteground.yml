name: Deploy to SiteGround

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent with SiteGround key
        env:
          SITEGROUND_SSH_PRIVATE_KEY: ${{ secrets.SITEGROUND_SSH_PRIVATE_KEY }}
          SITEGROUND_SSH_PASSPHRASE: ${{ secrets.SITEGROUND_SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SITEGROUND_SSH_PRIVATE_KEY" > ~/.ssh/siteground_key
          chmod 600 ~/.ssh/siteground_key
          eval "$(ssh-agent -s)"
          if [ -n "$SITEGROUND_SSH_PASSPHRASE" ]; then
            cat > ~/.ssh/askpass.sh <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$SITEGROUND_SSH_PASSPHRASE"
          EOF
            chmod 700 ~/.ssh/askpass.sh
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
            setsid ssh-add ~/.ssh/siteground_key < /dev/null
          else
            ssh-add ~/.ssh/siteground_key
          fi

      - name: Add SiteGround host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SITEGROUND_SSH_PORT }}" "${{ secrets.SITEGROUND_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync site files
        run: |
          rsync -avz --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".DS_Store" \
            --exclude ".env" \
            --exclude ".env.example" \
            --exclude "DEPLOYMENT.md" \
            --exclude "comp/" \
            --exclude "transfer/" \
            --exclude "launch-package/" \
            --exclude "launch-package-clean-2/" \
            --exclude "peptideprotocol-launch.zip" \
            --exclude "peptideprotocol-launch-clean-2.zip" \
            -e "ssh -p ${{ secrets.SITEGROUND_SSH_PORT }}" \
            ./ "${{ secrets.SITEGROUND_SSH_USER }}@${{ secrets.SITEGROUND_SSH_HOST }}:${{ secrets.SITEGROUND_REMOTE_PATH }}"
