name: Deploy to SiteGround

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent with SiteGround key
        env:
          SITEGROUND_SSH_PRIVATE_KEY_B64: ${{ secrets.SITEGROUND_SSH_PRIVATE_KEY_B64 }}
          SITEGROUND_SSH_PASSPHRASE: ${{ secrets.SITEGROUND_SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SITEGROUND_SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/siteground_key
          chmod 600 ~/.ssh/siteground_key
          if [ -n "$SITEGROUND_SSH_PASSPHRASE" ]; then
            ssh-keygen -p -P "$SITEGROUND_SSH_PASSPHRASE" -N "" -f ~/.ssh/siteground_key >/dev/null
          fi
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/siteground_key

      - name: Add SiteGround host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SITEGROUND_SSH_PORT }}" "${{ secrets.SITEGROUND_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync site files
        run: |
          rsync -avz --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".DS_Store" \
            --exclude ".env" \
            --exclude ".env.example" \
            --exclude "DEPLOYMENT.md" \
            --exclude "comp/" \
            --exclude "transfer/" \
            --exclude "launch-package/" \
            --exclude "launch-package-clean-2/" \
            --exclude "peptideprotocol-launch.zip" \
            --exclude "peptideprotocol-launch-clean-2.zip" \
            --exclude "repo-upload/" \
            --exclude "peptideprotocol-site-content.md" \
            -e "ssh -p ${{ secrets.SITEGROUND_SSH_PORT }}" \
            ./ "${{ secrets.SITEGROUND_SSH_USER }}@${{ secrets.SITEGROUND_SSH_HOST }}:${{ secrets.SITEGROUND_REMOTE_PATH }}"
